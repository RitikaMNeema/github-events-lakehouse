connector.name=iceberg

# Iceberg JDBC catalog, shared with Spark. Both engines read the same
# pointers, so a table Spark writes is immediately queryable here.
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=lake
iceberg.jdbc-catalog.connection-password=lake
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.default-warehouse-dir=s3://lakehouse/warehouse

# Native S3 filesystem pointed at SeaweedFS.
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=lakeadmin
s3.aws-secret-key=lakeadmin123
