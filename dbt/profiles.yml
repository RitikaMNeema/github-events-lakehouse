# Trino executes the SQL; Iceberg holds the data. `database` here is the
# Trino CATALOG name (conf/trino/catalog/iceberg.properties), not a DB.
gharchive:
  target: dev
  outputs:
    dev:
      type: trino
      host: trino
      port: 8080
      user: dbt
      database: iceberg
      schema: gold
      threads: 4
      http_scheme: http
      timezone: UTC
