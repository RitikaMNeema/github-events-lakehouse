name: gharchive
version: "1.0.0"
config-version: 2
profile: gharchive

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Incremental models only look this far back, so a late-arriving event
  # still gets picked up without rescanning the whole table every run.
  lookback_days: 3

models:
  gharchive:
    staging:
      +materialized: view
      +schema: staging
    gold:
      +materialized: table
      +schema: gold
      +properties:
        format: "'PARQUET'"

snapshots:
  gharchive:
    +target_schema: snapshots
    +properties:
      format: "'PARQUET'"
